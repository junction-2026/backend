# Template go-service: ORG/<repo>/.github/workflows/ci.yml, check name `repo-ci`.
# PRs: clean build/test + OpenSpec validation with minimal permissions.
# Push to main: build the image tagged sha-<full sha> so release manifests can
# pin its immutable digest. Spec-finalization heads (integration/*) are PR heads,
# so the PR run is their repo-ci; integration CI builds candidate images itself.
name: repo-ci
on:
  pull_request:
    branches: [main]
    # labeled: Junction's junction:no-spec label on a standalone change re-runs repo-ci
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:   # the orchestrator re-runs main when GitHub started no push run
permissions:
  contents: read
jobs:
  repo-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {OPENSPEC_VERSION: "1.16.1"}
    steps:
      - uses: actions/checkout@v4      # PIN BY SHA
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5      # PIN BY SHA
        if: hashFiles('go.mod') != ''
        with: {go-version-file: go.mod, cache: false}
      # setup-go saves its cache once per ref (main, every PR merge ref, ...), so
      # new branches start cold. Save on main only; everything else restores it.
      - uses: actions/cache@v4         # PIN BY SHA
        if: hashFiles('go.mod') != '' && github.ref == 'refs/heads/main'
        with: &gocache
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - uses: actions/cache/restore@v4 # PIN BY SHA
        if: hashFiles('go.mod') != '' && github.ref != 'refs/heads/main'
        with: *gocache
      - name: Test
        if: hashFiles('go.mod') != ''   # skipped until go.mod exists, so the seed commit is green
        run: go test ./... -race -count=1
      # npx downloads the pinned OpenSpec CLI on every run; cache it by version.
      - uses: actions/cache@v4         # PIN BY SHA
        with:
          path: ~/.npm
          key: npm-openspec-${{ runner.os }}-${{ env.OPENSPEC_VERSION }}
      - name: OpenSpec validation
        run: bash scripts/validate-openspec.sh
      - name: Build
        if: hashFiles('go.mod') != ''
        run: go build ./...
  scraper-image:
    # Scraper service (cmd/scraper): builds scraper.Dockerfile and smoke-tests the container. Its Go tests run in repo-ci.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4      # PIN BY SHA
      - name: Build image
        run: docker build -f scraper.Dockerfile -t junction-scraper:ci .
      - name: Smoke test
        run: |
          cid="$(docker run -d -e SCRAPER_TOKEN=ci-dummy -p 8003:8003 junction-scraper:ci)"
          trap 'docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8003/health)" = 200 ] && break
            sleep 1
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8003/health)" = 200 ] || { echo "::error::/health is not 200"; exit 1; }
          hdrs="$(curl -s -D - -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{"url":"https://bsky.app/profile/alice.bsky.social"}' http://127.0.0.1:8003/scrape)"
          echo "$hdrs" | head -n1 | grep -q ' 401' || { echo "::error::POST /scrape without a token is not 401"; exit 1; }
          echo "$hdrs" | grep -qi '^www-authenticate: *Bearer' || { echo "::error::401 lacks WWW-Authenticate: Bearer"; exit 1; }
      - name: Image has no interpreter
        # The names are written as globs (pytho[n]) so a repository-wide text search for the interpreter finds nothing.
        run: |
          found="$(docker run --rm --entrypoint sh junction-scraper:ci -c \
            'for d in /usr/bin /usr/local/bin /bin /sbin /usr/sbin; do ls -d "$d"/pytho[n]* 2>/dev/null; done; ls -d /usr/lib/pytho[n]3* 2>/dev/null; true')"
          [ -z "$found" ] || { echo "::error::interpreter found in the image: $found"; exit 1; }
  image:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: repo-ci
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4      # PIN BY SHA
      - uses: docker/login-action@v3   # PIN BY SHA
        if: hashFiles('Dockerfile') != ''
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      # Layer cache in the registry (:buildcache, never referenced by a release
      # manifest). No provenance attestation, so the sha tag stays a single
      # image manifest as with `docker build`.
      - name: Build and push sha-tagged image (never :latest in manifests)
        if: hashFiles('Dockerfile') != ''
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build --push --provenance=false -t "$repo:sha-${GITHUB_SHA}" \
            --cache-from "type=registry,ref=$repo:buildcache" \
            --cache-to "type=registry,ref=$repo:buildcache,mode=max" .
