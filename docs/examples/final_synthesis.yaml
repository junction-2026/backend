# Example finalizer registry entry: an LLM behind any OpenAI-compatible
# chat completions API (OpenAI, OpenRouter, vLLM, Ollama, LiteLLM, ...).
# Only analyzers with `llm: {include: true, description: ...}` reach the LLM
# (see propaganda_detection.yaml). The API key is never logged or returned.
analyzers:
  - id: final_synthesis
    name: Final synthesis
    category: synthesis
    trigger: after_all_analyzers_settled
    execution:
      adapter: llm
      base_url: ${FINALIZER_BASE_URL}            # e.g. https://api.openai.com/v1 (the adapter appends /chat/completions)
      api_key: ${FINALIZER_API_KEY}              # sent as "Authorization: Bearer <key>"; never logged or returned
      model: ${FINALIZER_MODEL}                  # required, no default, e.g. gpt-4o-mini
      prompt_file: /etc/orchestrator/finalizer/prompt.md   # system prompt; image default from config/finalizer/prompt.md
      temperature: 0
      max_tokens: 600
      timeout: 30s
      response_format: json_schema               # json_schema | json_object | none
      headers: {}                                # optional extra headers (e.g. OpenRouter's HTTP-Referer)
      extra_body: {}                             # optional provider-specific fields, merged into the request body
