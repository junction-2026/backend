# Example registry entries: translate the input to English with Mistral, then run the
# IDA-SERICS/PropagandaDetection service on the translation (it expects English text).
# MISTRAL_API_KEY is a Mistral API key; PROPAGANDA_DETECTION_URL is the service's prediction
# endpoint, e.g. http://propaganda-detection:8000/predict. Add this file to the directory in
# ANALYZERS_CONFIG (or merge the entries into your registry file) and set both variables.
# To analyze the original text instead, delete `translation`, `depends_on` and `input`.
analyzers:
  - id: translation
    name: Translation to English
    category: translation
    execution:
      adapter: mistral_translation
      api_key: ${MISTRAL_API_KEY}
      model: mistral-small-latest
      timeout: 60s
      # max_input_chars: 20000
      # skip_english: true      # no Mistral call for text that is clearly English (english_min_words: 8, english_min_ratio: 0.25)
  - id: propaganda_detection
    name: Propaganda detection
    category: propaganda
    depends_on: [translation]
    input:
      bindings:
        text: $analyzers.translation
    execution:
      adapter: propaganda_detection
      endpoint: ${PROPAGANDA_DETECTION_URL}
      timeout: 30s
      # headers:
      #   Authorization: Bearer ${PROPAGANDA_DETECTION_TOKEN}
    # Opts this analyzer's result in to the llm finalizer's input (final_synthesis.yaml).
    llm:
      include: true
      description: >
        Binary classifier for propaganda in the English machine translation of the input text (cut at
        max_input_chars for long input), not in the original text. `label` is PROPAGANDA or NO_PROPAGANDA;
        `score` is the model's confidence in that label (0–1), not a propaganda probability. It is a coarse
        whole-text classifier: its score does not measure how strong the propaganda is. PROPAGANDA is supporting
        evidence only together with another strong signal; on its own it is a weak hint.
