# Example registry entry: score the English translation for every propaganda technique label with the NCI
# document model (nci-technique) and/or the NCI short-post model (nci-social), selected by word count. It needs
# the `translation` analyzer of propaganda_detection.yaml (or any analyzer with that id that returns
# translated_text and source_language). Set NCI_TECHNIQUE_URL and NCI_SOCIAL_URL to the services' prediction
# endpoints (e.g. http://nci-technique:8000/predict) and ML_API_TOKEN to their bearer token. The optional `spans`
# block marks the exact phrases of the user's original text that carry each detected technique: TECHNIQUE_SPAN_URL is
# the sentence model (nci-social) used for English input, SPAN_LLM_BASE_URL, SPAN_LLM_API_KEY and SPAN_LLM_MODEL an
# OpenAI-compatible LLM used for other languages. Add this file to the directory in ANALYZERS_CONFIG and set the
# variables (remove `spans` to run without highlights).
analyzers:
  - id: techniques
    name: Propaganda techniques
    category: propaganda
    depends_on: [translation]
    input:
      bindings:
        text: $analyzers.translation
    execution:
      adapter: technique_classifier
      timeout: 30s
      social_max_words: 80     # up to 80 words: nci-social (128-token model)
      technique_min_words: 40  # from 40 words: nci-technique; 40-80 words run both
      technique:
        endpoint: ${NCI_TECHNIQUE_URL}
        headers:
          Authorization: Bearer ${ML_API_TOKEN}
        cutoff: 0.5
      social:
        endpoint: ${NCI_SOCIAL_URL}
        headers:
          Authorization: Bearer ${ML_API_TOKEN}
        cutoff: 0.3
      spans:
        timeout: 15s                 # span deadline; must be shorter than timeout; on expiry span_status: timeout
        max_sentences: 20            # English: sentences of the original text scored (the first 20)
        max_phrases_per_technique: 5 # other languages: accepted phrases per technique
        max_input_chars: 20000       # other languages: characters of the original text sent to the LLM
        sentence_model:
          endpoint: ${TECHNIQUE_SPAN_URL}
          headers:
            Authorization: Bearer ${ML_API_TOKEN}
          threshold: 0.5
          # thresholds: {Doubt: 0.6}   # per-technique overrides
        llm:
          base_url: ${SPAN_LLM_BASE_URL}
          api_key: ${SPAN_LLM_API_KEY}
          model: ${SPAN_LLM_MODEL}
          prompt_file: /etc/orchestrator/technique_spans/prompt.md   # image default from config/technique_spans/prompt.md
          temperature: 0
          max_tokens: 1000
          response_format: json_schema
    # Opts this analyzer's result in to the llm finalizer's input (final_synthesis.yaml).
    llm:
      include: true
      description: >
        Propaganda technique scores for the English machine translation of the input text. `results` has one
        entry per model that ran: `nci-technique` (document model) and/or `nci-social` (short-post model),
        chosen by word count. Each lists every technique label with `score`, the model's confidence in that
        technique on the English translation; scores are independent, several labels may be true at once and
        they need not sum to 1. `above_cutoff` is true when the score reaches that model's `cutoff`; a low score
        is not a technique. Scores of the two models are not comparable, not calibrated probabilities and must
        not be averaged. `known: false` marks a label outside the 18 SemEval-2020 techniques. `detected` lists
        the known techniques above cutoff in at least one model (`models` says which), each with `spans`: exact
        phrases of the user's original text (UTF-16 offsets) that carry it, empty when none was found or
        `span_status` is not `ok`. A detection is an indicator of a technique, not proof of propaganda.
